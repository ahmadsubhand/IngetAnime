services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingetanime-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    networks:
      - proxy_network
      - db_network
    volumes:
      - ./backend/uploads:/app/uploads:Z
  
  # frontend deployed on different platform
  # postgresql on different container

networks:
  proxy_network:
    external: true
  db_network:
    external: true
